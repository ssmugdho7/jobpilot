name: Periodic Scan

on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours
  workflow_dispatch:         # manual trigger from Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render + trigger scan
        run: |
          echo "Waking Render (cold start may take 60-90s)..."
          for i in 1 2 3; do
            RESP=$(curl -s -w "\n%{http_code}" \
              -X POST "${{ secrets.RENDER_URL }}/api/cron/scan" \
              -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
              --max-time 180 --retry 2 --retry-delay 10)
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -1)
            echo "Attempt $i: HTTP $HTTP_CODE — $BODY"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
              echo "Scan triggered successfully"
              exit 0
            fi
            echo "Retrying in 15s..."
            sleep 15
          done
          echo "Failed after 3 attempts"
          exit 1
