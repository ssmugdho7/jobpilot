<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobPilot — Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --blue: #2563eb; --blue-dark: #1d4ed8; --blue-light: #dbeafe;
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
      --text: #0f172a; --muted: #64748b;
      --green: #16a34a; --green-bg: #f0fdf4;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
      --code-bg: #f1f5f9;
    }
    [data-theme="dark"] {
      --blue: #60a5fa; --blue-dark: #93bbfd; --blue-light: #1e3a5f;
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --text: #f1f5f9; --muted: #94a3b8;
      --green: #4ade80; --green-bg: #052e16;
      --code-bg: #0f172a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: var(--blue); text-decoration: none; }

    .header { background: rgba(255,255,255,.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    [data-theme="dark"] .header { background: rgba(15,23,42,.85); }
    .logo { font-size: 20px; font-weight: 800; color: var(--blue); letter-spacing: -.5px; }
    .logo span { color: var(--text); }
    .header-right { display: flex; align-items: center; gap: 6px; }
    .nav { display: flex; align-items: center; gap: 2px; }
    .nav a { padding: 8px 14px; border-radius: 10px; font-size: 14px; color: var(--muted); font-weight: 500; transition: all .15s; }
    .nav a:hover { background: var(--bg); color: var(--text); }
    .nav a.active { color: var(--blue); background: var(--blue-light); }
    [data-theme="dark"] .nav a.active { background: rgba(96,165,250,.15); }
    .theme-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all .15s; }
    .theme-btn:hover { color: var(--text); border-color: var(--muted); }
    .user-pill { display: flex; align-items: center; gap: 8px; margin-left: 8px; padding-left: 12px; border-left: 1px solid var(--border); }
    .user-pill .name { font-size: 13px; color: var(--muted); font-weight: 500; }
    .user-pill .logout { font-size: 13px; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-weight: 500; transition: all .15s; }
    .user-pill .logout:hover { background: #fef2f2; color: #dc2626; }
    [data-theme="dark"] .user-pill .logout:hover { background: #450a0a; color: #f87171; }

    .hamburger { display: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); cursor: pointer; align-items: center; justify-content: center; flex-direction: column; gap: 5px; padding: 10px; }
    .hamburger span { display: block; width: 18px; height: 2px; background: var(--text); border-radius: 2px; transition: all .2s; }
    .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; }
    .mobile-overlay.open { display: block; }
    .mobile-drawer { position: absolute; right: 0; top: 0; bottom: 0; width: 280px; background: var(--card); box-shadow: var(--shadow); padding: 72px 16px 24px; display: flex; flex-direction: column; gap: 8px; }
    .mobile-drawer a { padding: 12px 16px; border-radius: 10px; font-size: 15px; font-weight: 500; color: var(--text); transition: all .15s; }
    .mobile-drawer a:hover { background: var(--bg); color: var(--blue); }
    .mobile-drawer-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--muted); }

    .main { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.5px; }
    .page-header .subtitle { color: var(--muted); font-size: 15px; }

    .topic-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; margin-bottom: 24px; box-shadow: var(--shadow); }
    .topic-card .topic-icon { font-size: 40px; margin-bottom: 12px; }
    .topic-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 16px; color: var(--blue); }
    .topic-content h2 { font-size: 20px; font-weight: 700; margin: 24px 0 10px; color: var(--blue); }
    .topic-content h3 { font-size: 16px; font-weight: 600; margin: 18px 0 8px; }
    .topic-content p { margin-bottom: 14px; }
    .topic-content pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; overflow-x: auto; font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
    .topic-content code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
    .topic-content ul, .topic-content ol { margin-bottom: 14px; padding-left: 24px; }
    .topic-content li { margin-bottom: 6px; }

    .next-topic { text-align: center; margin: 8px 0 28px; font-size: 14px; color: var(--muted); }
    .next-topic .timer { font-weight: 700; color: var(--blue); }

    .topics-section h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .topic-pill { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; cursor: pointer; transition: all .15s; text-decoration: none; color: var(--text); display: flex; align-items: center; gap: 12px; }
    .topic-pill:hover { border-color: var(--blue); box-shadow: 0 2px 8px rgba(37,99,235,.1); }
    .topic-pill.active { border-color: var(--blue); background: var(--blue-light); }
    [data-theme="dark"] .topic-pill.active { background: rgba(96,165,250,.1); }
    .topic-pill .icon { font-size: 28px; flex-shrink: 0; }
    .topic-pill .title { font-size: 14px; font-weight: 600; }

    @media (max-width: 768px) {
      .nav { display: none; }
      .user-pill { display: none; }
      .hamburger { display: flex; }
      .main { padding: 24px 16px 48px; }
      .page-header h1 { font-size: 24px; }
      .topic-card { padding: 20px; border-radius: 12px; }
      .topic-grid { grid-template-columns: 1fr; }
      .topic-pill { padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Job<span>Pilot</span></div>
    <div class="header-right">
      <div class="nav">
        <a href="/dashboard">Jobs</a>
        <a href="/learning" class="active">Learning</a>
        <a href="/profile">Profile</a>
      </div>
      <button class="theme-btn" onclick="toggleTheme()" title="Toggle dark mode" id="themeBtn">&#9789;</button>
      <div class="user-pill">
        <span class="name">{{ username }}</span>
        <a href="/logout" class="logout">Sign out</a>
      </div>
      <button class="hamburger" onclick="openDrawer()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="mobile-overlay" id="mobileDrawer" onclick="closeDrawer()">
    <div class="mobile-drawer" onclick="event.stopPropagation()">
      <button class="mobile-drawer-close" onclick="closeDrawer()">&times;</button>
      <a href="/dashboard">Jobs</a>
      <a href="/learning" style="color:var(--blue);font-weight:600">Learning</a>
      <a href="/profile">Profile</a>
    </div>
  </div>

  <div class="main">
    <div class="page-header">
      <h1>Learning Hub</h1>
      <p class="subtitle">One topic at a time. Learn something new every 20 minutes.</p>
    </div>

    <div class="topic-card">
      <div class="topic-icon">{{ topic.icon }}</div>
      <div class="topic-content">{{ topic.content|safe }}</div>
    </div>

    <div class="next-topic">
      Next topic in <span class="timer" id="timer">--:--</span>
    </div>

    <div class="topics-section">
      <h3>All Topics</h3>
      <div class="topic-grid">
        {% for t in all_topics %}
        <div class="topic-pill {{ 'active' if t.id == topic.id }}" onclick="showTopic({{ loop.index0 }})">
          <div class="icon">{{ t.icon }}</div>
          <div class="title">{{ t.title }}</div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>

  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      updateThemeBtn();
      updateTimer();
      setInterval(updateTimer, 1000);
    })();

    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeBtn();
    }

    function updateThemeBtn() {
      const btn = document.getElementById('themeBtn');
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.innerHTML = isDark ? '&#9788;' : '&#9789;';
    }

    function openDrawer() {
      document.getElementById('mobileDrawer').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      document.getElementById('mobileDrawer').classList.remove('open');
      document.body.style.overflow = '';
    }

    function updateTimer() {
      const now = new Date();
      const mins = now.getMinutes();
      const secs = now.getSeconds();
      const remaining = 20 - (mins % 20) - 1;
      const secsLeft = 60 - secs;
      document.getElementById('timer').textContent =
        (remaining < 0 ? 0 : remaining) + ':' + String(secsLeft).padStart(2, '0');
    }

    function showTopic(index) {
      const topics = {{ all_topics | map(attribute='id') | list | tojson }};
      if (topics[index]) {
        window.location.href = '/learning?topic=' + topics[index];
      }
    }
  </script>
</body>
</html>
