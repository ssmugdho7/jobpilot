<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobPilot — Sign in</title>
  <style>
    :root, [data-theme="light"] {
      --blue: #2563eb; --blue-dark: #1d4ed8; --bg: #f8fafc; --card: #ffffff;
      --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
    }
    [data-theme="dark"] {
      --blue: #60a5fa; --blue-dark: #93bbfd; --bg: #0f172a; --card: #1e293b;
      --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 36px; width: 100%; max-width: 380px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .logo { font-size: 24px; font-weight: 700; color: var(--blue); text-align: center; margin-bottom: 4px; }
    .logo span { color: var(--text); }
    .tagline { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 28px; }
    .error { background: #fef2f2; color: #dc2626; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    [data-theme="dark"] .error { background: #450a0a; color: #f87171; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
    .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--bg); color: var(--text); }
    .field input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .btn { width: 100%; padding: 10px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 6px; }
    .btn:hover { background: var(--blue-dark); }
    .footer { text-align: center; font-size: 13px; margin-top: 20px; color: var(--muted); }
    .footer a { color: var(--blue); }
    .theme-toggle { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .theme-toggle:hover { color: var(--text); border-color: var(--muted); }
  </style>
</head>
<body style="position:relative">
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" id="themeBtn">&#9789;</button>
  <div class="card">
    <div class="logo">Job<span>Pilot</span></div>
    <p class="tagline">Bangladesh IT job aggregator</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="field"><label>Username</label><input type="text" name="username" required autofocus></div>
      <div class="field"><label>Password</label><input type="password" name="password" required></div>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <div class="footer">Don't have an account? <a href="/register">Register</a></div>
  </div>
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      updateThemeBtn();
    })();
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeBtn();
    }
    function updateThemeBtn() {
      const btn = document.getElementById('themeBtn');
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.innerHTML = isDark ? '&#9788;' : '&#9789;';
    }
  </script>
</body>
</html>
