<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobPilot — Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --blue: #2563eb; --blue-dark: #1d4ed8; --bg: #f8fafc; --card: #ffffff;
      --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
      --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
    }
    [data-theme="dark"] {
      --blue: #60a5fa; --blue-dark: #93bbfd; --bg: #0f172a; --card: #1e293b;
      --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
      --shadow: 0 1px 3px rgba(0,0,0,.4); --shadow-lg: 0 10px 15px rgba(0,0,0,.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; -webkit-font-smoothing: antialiased; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); }
    .logo { font-size: 28px; font-weight: 800; color: var(--blue); text-align: center; margin-bottom: 4px; letter-spacing: -.5px; }
    .logo span { color: var(--text); }
    .tagline { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 32px; }
    .error { background: #fef2f2; color: #dc2626; padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; border: 1px solid #fecaca; }
    [data-theme="dark"] .error { background: #450a0a; color: #f87171; border-color: #7f1d1d; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .field input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; background: var(--bg); color: var(--text); transition: all .15s; font-family: inherit; }
    .field input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .field input::placeholder { color: var(--muted); }
    .btn { width: 100%; padding: 12px; background: var(--blue); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: all .2s; font-family: inherit; }
    .btn:hover { background: var(--blue-dark); box-shadow: 0 4px 12px rgba(37,99,235,.3); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .footer { text-align: center; font-size: 14px; margin-top: 24px; color: var(--muted); }
    .footer a { color: var(--blue); font-weight: 500; }
    .theme-btn { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all .15s; box-shadow: var(--shadow); }
    .theme-btn:hover { color: var(--text); border-color: var(--muted); }
    @media (max-width: 480px) {
      .card { padding: 28px 20px; border-radius: 12px; }
      .logo { font-size: 24px; }
    }
  </style>
</head>
<body style="position:relative">
  <button class="theme-btn" onclick="toggleTheme()" title="Toggle dark mode" id="themeBtn">&#9789;</button>
  <div class="card">
    <div class="logo">Job<span>Pilot</span></div>
    <p class="tagline">Sign in to your account</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="field"><label>Username</label><input type="text" name="username" required autofocus placeholder="Enter your username"></div>
      <div class="field"><label>Password</label><input type="password" name="password" required placeholder="Enter your password"></div>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <div class="footer">Don't have an account? <a href="/register">Register</a> &middot; <a href="/">Home</a></div>
  </div>
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      updateThemeBtn();
    })();
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeBtn();
    }
    function updateThemeBtn() {
      const btn = document.getElementById('themeBtn');
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.innerHTML = isDark ? '&#9788;' : '&#9789;';
    }
  </script>
</body>
</html>
