<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobPilot — Profile</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 18px; font-weight: 700; color: var(--blue); display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--text); }
    .nav { display: flex; align-items: center; gap: 8px; }
    .nav a { padding: 6px 14px; border-radius: 6px; font-size: 14px; color: var(--muted); font-weight: 500; }
    .nav a:hover { background: var(--bg); text-decoration: none; }
    .nav a.active { color: var(--blue); background: #eff6ff; }
    .user-menu { display: flex; align-items: center; gap: 10px; margin-left: 16px; padding-left: 16px; border-left: 1px solid var(--border); }
    .user-menu .name { font-size: 13px; color: var(--muted); }
    .user-menu .logout { font-size: 13px; color: var(--muted); padding: 4px 10px; border-radius: 6px; }
    .user-menu .logout:hover { background: #fef2f2; color: #dc2626; text-decoration: none; }

    .main { max-width: 700px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--text); }
    .card p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
    .field input, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .field textarea { resize: vertical; min-height: 70px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 500px) { .row { grid-template-columns: 1fr; } }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all .15s; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-dark); }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; display: none; z-index: 200; box-shadow: 0 4px 12px rgba(0,0,0,.15); }

    @media (max-width: 640px) {
      .header { padding: 0 14px; }
      .main { padding: 20px 14px 40px; }
      .user-menu { display: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Job<span>Pilot</span></div>
    <div style="display:flex;align-items:center">
      <div class="nav">
        <a href="/">Jobs</a>
        <a href="/profile" class="active">Profile</a>
      </div>
      <div class="user-menu">
        <span class="name">{{ username }}</span>
        <a href="/logout" class="logout">Sign out</a>
      </div>
    </div>
  </div>

  <div class="main">
    <h1>Profile</h1>
    <p class="subtitle">Your information is used to personalize Gmail application drafts.</p>

    <div class="card">
      <h2>Personal information</h2>
      <div class="row">
        <div class="field"><label>Full name</label><input id="name" value="{{ profile.name }}"></div>
        <div class="field"><label>Email</label><input id="email" value="{{ profile.email }}" type="email"></div>
      </div>
      <div class="row">
        <div class="field"><label>Phone</label><input id="phone" value="{{ profile.phone }}"></div>
        <div class="field"><label>LinkedIn</label><input id="linkedin" value="{{ profile.linkedin }}"></div>
      </div>
      <div class="row">
        <div class="field"><label>GitHub</label><input id="github" value="{{ profile.github }}"></div>
        <div class="field"><label>Portfolio</label><input id="portfolio" value="{{ profile.portfolio }}"></div>
      </div>
    </div>

    <div class="card">
      <h2>Professional details</h2>
      <p>Used to personalize the Gmail compose body text for each job application.</p>
      <div class="field"><label>Skills (comma-separated)</label><textarea id="skills" rows="2">{{ profile.skills|join(', ') }}</textarea></div>
      <div class="field"><label>Summary</label><textarea id="summary">{{ profile.summary }}</textarea></div>
      <div class="row">
        <div class="field"><label>Experience</label><textarea id="experience">{{ profile.experience }}</textarea></div>
        <div class="field"><label>Education</label><textarea id="education">{{ profile.education }}</textarea></div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="saveProfile()">Save profile</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function val(id) { return document.getElementById(id).value.trim(); }

    async function saveProfile() {
      const body = {
        name: val('name'), email: val('email'), phone: val('phone'),
        linkedin: val('linkedin'), github: val('github'), portfolio: val('portfolio'),
        education: val('education'), experience: val('experience'), summary: val('summary'),
        skills: val('skills').split(',').map(s => s.trim()).filter(Boolean)
      };
      try {
        const r = await fetch('/api/profile', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const d = r.ok ? await r.json() : null;
        showToast(d && d.ok ? 'Profile saved' : 'Save failed');
      } catch (e) { showToast('Error saving profile'); }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.style.display = 'block';
      clearTimeout(t._h);
      t._h = setTimeout(() => { t.style.display = 'none'; }, 3000);
    }
  </script>
</body>
</html>
