# Company career-page sources (software / telecommunication / IT — startup,
# MNC, private, government). Each entry is fetched during every scan.

# Supported types:
#   html           -> static job-list HTML page (links parsed from anchors)
#   smartrecruiters -> SmartRecruiters JSON API (identifier = company slug)
#   greenhouse     -> Greenhouse board API (board = token from careers URL)
#   lever          -> Lever postings API (slug from jobs.lever.co/<slug>)
#   ashby          -> Ashby GraphQL API (slug from jobs.ashbyhq.com/<slug>)
#
# location is optional per company; when absent it defaults to "Bangladesh".
# Only jobs that (a) match one of the 8 roles and (b) are Bangladesh-located
# are kept (same rules as LinkedIn/BDJobs).

companies:
  # ---- HTML career pages (verified reachable & parseable) ----
  - name: "Therap (BD) Ltd"
    site: "therapservices.net"
    careers_url: "https://www.therapservices.net/jobs/"
    type: html
    location: "Bangladesh"

