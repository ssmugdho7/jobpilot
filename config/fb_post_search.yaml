# Facebook Graph API — fetch posts from specific FB pages in Bangladesh.
# Toggle persisted in DB via fb_post_search_enabled setting.
# Token: FACEBOOK_ACCESS_TOKEN env var.

enabled: true

# Max age for FB posts in DB (days). Posts older than this are
# deleted on each scan.
max_age_days: 3

# Specific Facebook pages/groups to fetch posts from.
pages:
  - id: "61583966924591"
    name: "BD Jobs Circular"
    type: "page"
  - id: "thecvguy.net"
    name: "The CV Guy"
    type: "page"
  - id: "17ntbcEs55"
    name: "BD Tech Jobs"
    type: "group"
  - id: "careerzonebangladesh"
    name: "Career Zone Bangladesh"
    type: "page"

# No keyword filter — show ALL posts from configured pages
job_keywords: []

# No location filter — show all posts
location_keywords: []

# Limits
posts_per_page: 25
