# fly.toml

app = "jobpilot-little-valley-4408"
primary_region = "sjc"

[env]
  GEMINI_MODEL = "gemini-3.5-flash-preview"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.ports]]
    port = 80

  [[http_service.ports]]
    port = 443

[[mounts]]
  source = "jobpilot_data"
  destination = "/app/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"