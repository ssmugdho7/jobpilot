services:
  - type: web
    name: jobpilot
    runtime: image
    image:
      url: ""  # uses Dockerfile from repo root
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        sync: false
        value: "8080"
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_API_KEYS
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
